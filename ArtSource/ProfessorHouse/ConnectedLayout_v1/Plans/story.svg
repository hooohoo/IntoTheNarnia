<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" width="1600" height="1320"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}</style><rect width="1600" height="1320" fill="#FCF8EF"/><text x="84.00" y="50.00" text-anchor="start" font-size="14" font-weight="600" fill="#9C7E58" ><tspan x="84.00" dy="0">PROFESSOR’S HOUSE / THREE SCENES, ONE HOUSE</tspan></text><text x="84.00" y="108.00" text-anchor="start" font-size="34" font-weight="750" fill="#493E33" ><tspan x="84.00" dy="0">처음 안내받은 집을 탐험하고, 아는 길로 피신합니다</tspan></text><text x="84.00" y="153.00" text-anchor="start" font-size="19" font-weight="500" fill="#8D7B63" ><tspan x="84.00" dy="0">아래 흐름은 장면을 위한 동선 제안입니다. 각 단계의 위치는 층별 도면과 같은 이름을 사용합니다.</tspan></text><text x="84.00" y="235.00" text-anchor="start" font-size="26" font-weight="750" fill="#287D97" ><tspan x="84.00" dy="0">① 첫 안내</tspan></text><rect x="84" y="263" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#287D97" stroke-width="2"/><text x="247.00" y="314.00" text-anchor="middle" font-size="22" font-weight="700" fill="#287D97" ><tspan x="247.00" dy="0">2층 계단 도착</tspan></text><text x="247.00" y="354.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="247.00" dy="0">서측 회랑</tspan></text><text x="430.00" y="341.00" text-anchor="middle" font-size="27" font-weight="700" fill="#287D97" ><tspan x="430.00" dy="0">→</tspan></text><rect x="452" y="263" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#287D97" stroke-width="2"/><text x="615.00" y="314.00" text-anchor="middle" font-size="22" font-weight="700" fill="#287D97" ><tspan x="615.00" dy="0">교수 구역 경고</tspan></text><text x="615.00" y="354.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="615.00" dy="0">문을 가리키기만 함</tspan></text><text x="798.00" y="341.00" text-anchor="middle" font-size="27" font-weight="700" fill="#287D97" ><tspan x="798.00" dy="0">→</tspan></text><rect x="820" y="263" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#287D97" stroke-width="2"/><text x="983.00" y="314.00" text-anchor="middle" font-size="22" font-weight="700" fill="#287D97" ><tspan x="983.00" dy="0">E3 → 동측 회랑</tspan></text><text x="983.00" y="354.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="983.00" dy="0">반대편으로 돌아감</tspan></text><text x="1166.00" y="341.00" text-anchor="middle" font-size="27" font-weight="700" fill="#287D97" ><tspan x="1166.00" dy="0">→</tspan></text><rect x="1188" y="263" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#287D97" stroke-width="2"/><text x="1351.00" y="314.00" text-anchor="middle" font-size="22" font-weight="700" fill="#287D97" ><tspan x="1351.00" dy="0">동쪽 후면 침실</tspan></text><text x="1351.00" y="354.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="1351.00" dy="0">남녀 방·욕실</tspan></text><text x="84.00" y="436.00" text-anchor="start" font-size="18" font-weight="500" fill="#87765E" ><tspan x="84.00" dy="0">교수 전용문은 가까이 보이고, 아이들 방은 두 번 꺾이는 긴 접근 끝에 나타납니다.</tspan></text><text x="84.00" y="535.00" text-anchor="start" font-size="26" font-weight="750" fill="#3B856A" ><tspan x="84.00" dy="0">② 숨바꼭질</tspan></text><rect x="84" y="563" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#3B856A" stroke-width="2"/><text x="247.00" y="614.00" text-anchor="middle" font-size="22" font-weight="700" fill="#3B856A" ><tspan x="247.00" dy="0">2층 놀이방</tspan></text><text x="247.00" y="654.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="247.00" dy="0">빈 방도 살펴봄</tspan></text><text x="430.00" y="641.00" text-anchor="middle" font-size="27" font-weight="700" fill="#3B856A" ><tspan x="430.00" dy="0">→</tspan></text><rect x="452" y="563" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#3B856A" stroke-width="2"/><text x="615.00" y="614.00" text-anchor="middle" font-size="22" font-weight="700" fill="#3B856A" ><tspan x="615.00" dy="0">회랑 → 보조 계단</tspan></text><text x="615.00" y="654.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="615.00" dy="0">교수 구역은 안 거침</tspan></text><text x="798.00" y="641.00" text-anchor="middle" font-size="27" font-weight="700" fill="#3B856A" ><tspan x="798.00" dy="0">→</tspan></text><rect x="820" y="563" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#3B856A" stroke-width="2"/><text x="983.00" y="614.00" text-anchor="middle" font-size="22" font-weight="700" fill="#3B856A" ><tspan x="983.00" dy="0">다락 목재 복도</tspan></text><text x="983.00" y="654.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="983.00" dy="0">창고 문을 지나감</tspan></text><text x="1166.00" y="641.00" text-anchor="middle" font-size="27" font-weight="700" fill="#3B856A" ><tspan x="1166.00" dy="0">→</tspan></text><rect x="1188" y="563" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#3B856A" stroke-width="2"/><text x="1351.00" y="614.00" text-anchor="middle" font-size="22" font-weight="700" fill="#3B856A" ><tspan x="1351.00" dy="0">끝의 옷장방</tspan></text><text x="1351.00" y="654.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="1351.00" dy="0">루시가 처음 발견</tspan></text><text x="84.00" y="736.00" text-anchor="start" font-size="18" font-weight="500" fill="#87765E" ><tspan x="84.00" dy="0">침실 앞에서 옷장이 바로 드러나지 않습니다. 방과 복도를 탐색한 끝에 발견합니다.</tspan></text><text x="84.00" y="835.00" text-anchor="start" font-size="26" font-weight="750" fill="#C67832" ><tspan x="84.00" dy="0">③ 창문·유물 사고</tspan></text><rect x="84" y="863" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#C67832" stroke-width="2"/><text x="247.00" y="914.00" text-anchor="middle" font-size="22" font-weight="700" fill="#C67832" ><tspan x="247.00" dy="0">서쪽 정원 → 전시실</tspan></text><text x="247.00" y="954.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="247.00" dy="0">창·갑옷 일부 파손</tspan></text><text x="430.00" y="941.00" text-anchor="middle" font-size="27" font-weight="700" fill="#C67832" ><tspan x="430.00" dy="0">→</tspan></text><rect x="452" y="863" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#C67832" stroke-width="2"/><text x="615.00" y="914.00" text-anchor="middle" font-size="22" font-weight="700" fill="#C67832" ><tspan x="615.00" dy="0">파손 확인 뒤 발소리</tspan></text><text x="615.00" y="954.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="615.00" dy="0">겁이 나 안쪽 아치로</tspan></text><text x="798.00" y="941.00" text-anchor="middle" font-size="27" font-weight="700" fill="#C67832" ><tspan x="798.00" dy="0">→</tspan></text><rect x="820" y="863" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#C67832" stroke-width="2"/><text x="983.00" y="914.00" text-anchor="middle" font-size="22" font-weight="700" fill="#C67832" ><tspan x="983.00" dy="0">홀 → 연결 복도 → S2</tspan></text><text x="983.00" y="954.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="983.00" dy="0">1층 → 2층 → 다락</tspan></text><text x="1166.00" y="941.00" text-anchor="middle" font-size="27" font-weight="700" fill="#C67832" ><tspan x="1166.00" dy="0">→</tspan></text><rect x="1188" y="863" width="326" height="132" rx="14" fill="#F3EEE3" stroke="#C67832" stroke-width="2"/><text x="1351.00" y="914.00" text-anchor="middle" font-size="22" font-weight="700" fill="#C67832" ><tspan x="1351.00" dy="0">다시 옷장방으로</tspan></text><text x="1351.00" y="954.00" text-anchor="middle" font-size="18" font-weight="500" fill="#87765E" ><tspan x="1351.00" dy="0">네 아이가 함께 이동</tspan></text><text x="84.00" y="1036.00" text-anchor="start" font-size="18" font-weight="500" fill="#87765E" ><tspan x="84.00" dy="0">유물을 망가뜨렸다는 두려움이 먼저 생기고, 돌아갈 쪽에서 들리는 발소리가 피신의 계기가 됩니다.</tspan></text><text x="84.00" y="1185.00" text-anchor="start" font-size="21" font-weight="750" fill="#493E33" ><tspan x="84.00" dy="0">설계 기준</tspan></text><text x="84.00" y="1225.00" text-anchor="start" font-size="18" font-weight="500" fill="#8F7E67" ><tspan x="84.00" dy="0">교수의 서재는 2층 전용 구역 · 아이들 침실은 외진 동쪽 끝 · 옷장방은 다른 층의 탐험 끝점</tspan><tspan x="84.00" dy="24.3">사고 창의 1층 배치는 사용자 요청을 적용한 안입니다. 비공식 영화 전사본의 위층 표기와 구분합니다.</tspan></text></svg>