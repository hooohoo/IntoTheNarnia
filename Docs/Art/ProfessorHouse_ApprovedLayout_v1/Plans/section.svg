<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" width="1600" height="1240" role="img" aria-label="1층, 2층, 다락과 높은 계단 홀의 관계"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}</style><rect width="1600" height="1240" fill="#FCF8EF"/><text x="84.00" y="52.00" text-anchor="start" font-size="14" font-weight="600" fill="#9C7E58" ><tspan x="84.00" dy="0">PROFESSOR’S HOUSE / FLOOR RELATION</tspan></text><text x="84.00" y="105.00" text-anchor="start" font-size="35" font-weight="750" fill="#493E33" ><tspan x="84.00" dy="0">2층은 홀의 양옆에, 다락 복도는 홀의 천장 위에</tspan></text><text x="84.00" y="148.00" text-anchor="start" font-size="19" font-weight="500" fill="#8D7B63" ><tspan x="84.00" dy="0">층 관계를 이해하기 위한 개념 단면입니다. 가로 길이는 축척을 맞추지 않았습니다.</tspan></text><rect x="275" y="707.2" width="300" height="172.8" fill="#E7D6BE" stroke="#8C7B64" stroke-width="2"/><rect x="275" y="520" width="300" height="187.2" fill="#DBD4E4" stroke="#8C7B64" stroke-width="2"/><rect x="575" y="526.4" width="390" height="353.6" fill="#EEE3CD" stroke="#8C7B64" stroke-width="2"/><path d="M275 520 L275 406.0 L640 328.0 L965 406.0 L965 520 Z" fill="#EEE7DB" stroke="#8C7B64" stroke-width="3"/><rect x="675" y="424.0" width="290" height="96.0" fill="#D5E7E9"/><rect x="575" y="520" width="390" height="6.4" fill="#7D6850"/><rect x="965" y="290" width="430" height="590" fill="#E2EBCF"/><line x1="965" x2="965" y1="776.0" y2="560.0" stroke="#4693A0" stroke-width="10"/><rect x="871" y="808.0" width="94" height="72.0" fill="#BD9B76" stroke="#917859"/><rect x="731" y="872.8" width="14" height="7.199999999999999" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="745" y="865.6" width="14" height="14.399999999999999" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="759" y="858.4" width="14" height="21.6" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="773" y="851.2" width="14" height="28.799999999999997" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="787" y="844.0" width="14" height="36.0" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="801" y="836.8" width="14" height="43.2" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="815" y="829.6" width="14" height="50.4" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="829" y="822.4" width="14" height="57.599999999999994" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="843" y="815.2" width="14" height="64.8" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><rect x="857" y="808.0" width="14" height="72.0" fill="#C7AB87" stroke="#917859" stroke-width=".7"/><path d="M 575 707.2 H 627" stroke="#607F83" stroke-width="9"/><text x="425.00" y="792.00" text-anchor="middle" font-size="25" font-weight="700" fill="#493E33" ><tspan x="425.00" dy="0">1층</tspan><tspan x="425.00" dy="33.75">현관·응접·식사</tspan></text><text x="425.00" y="604.00" text-anchor="middle" font-size="25" font-weight="700" fill="#493E33" ><tspan x="425.00" dy="0">2층</tspan><tspan x="425.00" dy="33.75">서재·침실·손님방</tspan></text><text x="780.00" y="604.00" text-anchor="middle" font-size="24" font-weight="650" fill="#8B775E" ><tspan x="780.00" dy="0">높은 계단 홀</tspan><tspan x="780.00" dy="32.400000000000006">2층 중앙에 바닥 없음</tspan></text><text x="815.00" y="456.00" text-anchor="middle" font-size="21" font-weight="700" fill="#3F727B" ><tspan x="815.00" dy="0">다락 복도</tspan><tspan x="815.00" dy="28.35">홀 천장 위로 이동</tspan></text><text x="1180.00" y="470.00" text-anchor="middle" font-size="28" font-weight="700" fill="#55723A" ><tspan x="1180.00" dy="0">후정 · 정원</tspan><tspan x="1180.00" dy="37.800000000000004">위로 열린 야외</tspan></text><text x="1180.00" y="555.00" text-anchor="middle" font-size="20" font-weight="500" fill="#708754" ><tspan x="1180.00" dy="0">2층·다락 높이에도</tspan><tspan x="1180.00" dy="27.0">복도나 지붕을 놓지 않음</tspan></text><text x="1000.00" y="746.00" text-anchor="start" font-size="19" font-weight="650" fill="#3F8390" ><tspan x="1000.00" dy="0">← 아치창</tspan></text><text x="920.00" y="835.00" text-anchor="middle" font-size="15" font-weight="500" fill="#7E6042" ><tspan x="920.00" dy="0">계단참 +1.80 m</tspan></text><line x1="84" y1="520" x2="255" y2="520" stroke="#237D91" stroke-width="2"/><text x="84.00" y="508.00" text-anchor="start" font-size="21" font-weight="700" fill="#237D91" ><tspan x="84.00" dy="0">다락 +9.00 m</tspan></text><line x1="84" y1="707.2" x2="255" y2="707.2" stroke="#237D91" stroke-width="2"/><text x="84.00" y="695.20" text-anchor="start" font-size="21" font-weight="700" fill="#237D91" ><tspan x="84.00" dy="0">2층 +4.32 m</tspan></text><line x1="84" y1="880" x2="255" y2="880" stroke="#8C7B64" stroke-width="2"/><text x="84.00" y="868.00" text-anchor="start" font-size="21" font-weight="700" fill="#8C7B64" ><tspan x="84.00" dy="0">1층 ±0.00 m</tspan></text><text x="635.00" y="553.00" text-anchor="start" font-size="16" font-weight="500" fill="#7E6C55" ><tspan x="635.00" dy="0">홀 천장 +8.84 m</tspan></text><text x="710.00" y="260.00" text-anchor="middle" font-size="16" font-weight="500" fill="#9A8971" ><tspan x="710.00" dy="0">지붕 형태·높이는 설명용</tspan><tspan x="710.00" dy="21.6">다락의 실제 유효 높이는 후속 모델에서 검토</tspan></text><text x="84.00" y="990.00" text-anchor="start" font-size="23" font-weight="700" fill="#493E33" ><tspan x="84.00" dy="0">계단 연결</tspan></text><text x="84.00" y="1032.00" text-anchor="start" font-size="20" font-weight="500" fill="#786952" ><tspan x="84.00" dy="0">주 계단: 1층 → 계단참 +1.80 → 좌우 회랑 +4.32</tspan><tspan x="84.00" dy="27.0">보조 계단 S2: 1층 → 2층 → 다락. 평면 위치는 세 층 모두 동일.</tspan></text><text x="84.00" y="1132.00" text-anchor="start" font-size="17" font-weight="500" fill="#9A8971" ><tspan x="84.00" dy="0">다락의 옷장방은 서쪽 건물에 있습니다. 위 그림은 층의 높이 관계를 설명하며, 모든 방을 한 단면에 모아 놓은 것은 아닙니다.</tspan><tspan x="84.00" dy="22.950000000000003">층고는 검토 04의 제작 제안치를 사용했습니다. 영화 실측이나 실제 시공 구조를 확정한 도면은 아닙니다.</tspan></text></svg>