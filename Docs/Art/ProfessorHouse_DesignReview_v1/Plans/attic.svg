 y="310" font-size="25" fill="#3d7182" text-anchor="start" font-weight="700">F</text><text x="1830" y="310" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">영화에서 확인한 부분 요소</text><text x="1790" y="375" font-size="25" fill="#3d7182" text-anchor="start" font-weight="700">S</text><text x="1830" y="375" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">승인 시안의 조형·재질</text><text x="1790" y="440" font-size="25" fill="#3d7182" text-anchor="start" font-weight="700">U</text><text x="1830" y="440" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">기존 씬의 동선에서 계승</text><text x="1790" y="505" font-size="25" fill="#3d7182" text-anchor="start" font-weight="700">P</text><text x="1830" y="505" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">통합을 위한 새 설계</text><text x="1790" y="605" font-size="20" fill="#43382c" text-anchor="start" font-weight="400">모든 치수와 방의 연결 위치는</text><text x="1790" y="635" font-size="20" fill="#43382c" text-anchor="start" font-weight="400">게임용 제안치입니다.</text><text x="1790" y="680" font-size="20" fill="#43382c" text-anchor="start" font-weight="400">F 표시는 실제 방 배치가</text><text x="1790" y="710" font-size="20" fill="#43382c" text-anchor="start" font-weight="400">확정됐다는 뜻이 아닙니다.</text><text x="1790" y="795" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">G2: 입구 남쪽 / 옷장 북쪽</text><text x="1790" y="834" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">서쪽 외벽 창 2개 유지</text><text x="1790" y="873" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">창 바깥에 방이나 복도 없음</text><text x="1790" y="912" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">G1: 한 번 꺾이는 접근 동선</text><text x="1790" y="951" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">G3/G4: 닫힌 창고 공간 제안</text><text x="1790" y="1175" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">지형의 북쪽은 미확정.</text><text x="1790" y="1205" font-size="19" fill="#43382c" text-anchor="start" font-weight="400">이 도면의 위 = 저택 후면.</text><text x="100" y="1485" font-size="22" fill="#43382c" text-anchor="start" font-weight="400">검토 초점: B 계단 분기  →  E 상층 복도  →  G 옷장 방 / F 긴 복도는 중정 둘레로 연결</text><text x="100" y="1530" font-size="20" fill="#867869" text-anchor="start" font-weight="400">정밀 시공도 아님 · 검토 이미지 우선 · Unity 씬 적용 전</text></g></svg>