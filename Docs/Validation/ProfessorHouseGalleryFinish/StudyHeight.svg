<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">교수 서재의 실제 높이</title><desc id="desc">마감 바닥에서 천장까지 4.423미터, 가장 낮은 보 아래까지 4.158미터. 확정 층고는 유지하고 책장을 높였습니다.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="#52695b"/></marker></defs>
