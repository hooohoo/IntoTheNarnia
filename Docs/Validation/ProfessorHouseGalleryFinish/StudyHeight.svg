<text x="150" y="580" font-size="18">구조: 2층 +4.32 m / 다락 +9.00 m → 층간 높이 4.68 m 유지</text>
<text x="150" y="612" font-size="16">완성 시안은 분위기 참고이며 한 장의 원근 이미지에서 절대 층고를 역산하지 않습니다.</text>
