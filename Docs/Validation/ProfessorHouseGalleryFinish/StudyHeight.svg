<text x="195" y="472" font-size="16" fill="#f4eee1">창 하단 +1.00 m</text><text x="195" y="496" font-size="16" fill="#f4eee1">창 상단 +2.80 m</text>
<text x="506" y="194" font-size="17" fill="#f4eee1">책장 상단 약 3.98 m</text>
